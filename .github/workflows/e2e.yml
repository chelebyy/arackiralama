name: E2E Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests (Playwright, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Build and start backend services
      - name: Docker Compose up
        run: |
          cd backend
          docker compose up -d --build postgres redis api

      - name: Wait for services
        run: |
          echo "Waiting for API to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:5000/health > /dev/null 2>&1; then
              echo "API is ready!"
              exit 0
            fi
            echo "Attempt $i/30 - API not ready, waiting..."
            sleep 2
          done
          echo "API failed to start within 60 seconds"
          exit 1

      # Build and start standalone frontend server
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build frontend
        run: pnpm build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
          AUTH_BACKEND_URL: http://localhost:5000

      - name: Include static assets in standalone server
        run: |
          mkdir -p .next/standalone/frontend/.next
          cp -R .next/static .next/standalone/frontend/.next/static
          cp -R public .next/standalone/frontend/public
        working-directory: frontend

      - name: Start frontend server
        run: |
          PORT=3000 node .next/standalone/frontend/server.js &
          echo "Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i/30 - server not ready, waiting..."
            sleep 2
          done
          echo "Server failed to start within 60 seconds"
          exit 1
        working-directory: frontend
        env:
          PORT: 3000
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
          AUTH_BACKEND_URL: http://localhost:5000

      - name: Verify frontend JavaScript is served
        run: |
          asset=$(find .next/static -type f -name '*.js' -print -quit)
          test -n "$asset"
          curl --fail --silent --show-error "http://localhost:3000/_next/static/${asset#.next/static/}" -o /dev/null
        working-directory: frontend

      - name: Run E2E tests (shard ${{ matrix.shard }}/2)
        run: npx playwright test --shard=${{ matrix.shard }}/2 --project=chromium
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-artifacts-${{ github.run_number }}-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/playwright-traces/
          retention-days: 14

      - name: Upload JUnit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-junit-report-${{ github.run_number }}-shard-${{ matrix.shard }}
          path: frontend/playwright-results/results.xml
          retention-days: 14

      - name: Docker Compose down
        if: always()
        run: |
          cd backend
          docker compose down -v
